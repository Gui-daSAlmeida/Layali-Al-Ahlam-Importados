<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendas - Layali Al Ahlam</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Layali Al Ahlam Importados</h1>
        <p>Registro de Vendas</p>
    </header>


    <main>

        <a href="index.html">← Voltar ao menu</a>


        <h2>Registrar Venda</h2>


        <form id="formVenda">

            <label>Cliente:</label>

            <select id="cliente" required>

                <option value="">
                    Selecione um cliente
                </option>

            </select>


            <label>Vendedor:</label>

            <select id="vendedor" required>

                <option value="">
                    Selecione um vendedor
                </option>

            </select>


            <label>Produto:</label>

            <select id="produto" required>

                <option value="">
                    Selecione um produto
                </option>

            </select>


            <label>Quantidade:</label>

            <input
                type="number"
                id="quantidade"
                min="1"
                value="1"
                required
            >


            <button type="submit">
                Registrar Venda
            </button>

        </form>


        <hr>


        <h2>Vendas realizadas</h2>


        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Vendedor</th>
                    <th>Data</th>
                    <th>Valor</th>

                </tr>

            </thead>


            <tbody id="listaVendas"></tbody>

        </table>

    </main>


    <script src="js/vendas.js"></script>

</body>

</html>
